<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wi-Fi 人流偵測系統</title>
    <link href="assets/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@200..900&display=swap" rel="stylesheet">
    <style>
        .date-picker-group {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            flex-wrap: wrap;
        }

        *,
        .btn {
            font-family: 'Chiron GoRound TC', sans-serif;
        }

        .nav-link,
        .btn {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-sm {
            padding: 0.25rem 0.75rem;
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .form-control,
        .form-select {
            border-radius: 0.844rem;
        }

        .card {
            border-radius: 1.2rem;
            overflow: hidden;
        }

        .chart-container {
            position: relative;
            min-height: 300px;
            width: 100%;
        }

        .empty-state-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: white;
            z-index: 10;
        }

        @media (min-width: 768px) {
            .offcanvas-md {
                position: sticky;
                top: 20px;
                height: calc(100vh - 100px);
            }

            .chart-container {
                min-height: 400px;
            }
        }
    </style>
</head>

<body class="bg-light">
    <nav class="navbar navbar-expand-lg bg-white shadow-sm mb-4">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold text-primary d-flex align-items-center" href="#">
                <span class="material-symbols-rounded align-middle me-2">sensors</span>
                Wi-Fi 人流偵測系統
            </a>
        </div>
    </nav>

    <div class="container p-3">
        <div class="tab-content" id="v-pills-tabContent">

            <div class="tab-pane fade show active" id="v-pills-home" role="tabpanel" aria-labelledby="v-pills-home-tab"
                tabindex="0">
                <h4 class="mb-3">人流偵測總覽</h4>

                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-body rounded d-flex justify-content-between flex-wrap gap-3">
                        <div class="date-picker-group">
                            <div class="me-2 border-end border-muted pe-3">
                                <label for="locationSelect" class="form-label mb-1"
                                    style="font-size: 0.85rem;">偵測地點</label>
                                <select class="form-select form-select-sm" id="locationSelect" onchange="fetchData()">
                                    <option value="NTHU_Campus">清大校園 (NTHU_Campus)</option>
                                    <option value="Library">圖書館 (Library)</option>
                                    <option value="Canteen">餐廳 (Cafeteria)</option>
                                </select>
                            </div>
                            <div>
                                <label for="startDate" class="form-label mb-1" style="font-size: 0.85rem;">開始時間</label>
                                <input type="datetime-local" class="form-control form-control-sm" id="startDate"
                                    onchange="updateChart()">
                            </div>
                            <div class="pb-1 fw-bold text-muted">~</div>
                            <div>
                                <label for="endDate" class="form-label mb-1" style="font-size: 0.85rem;">結束時間</label>
                                <input type="datetime-local" class="form-control form-control-sm" id="endDate"
                                    onchange="updateChart()">
                            </div>
                            <div class="d-flex gap-2">
                                <button class="btn btn-outline-secondary btn-sm" onclick="setToday()">今天</button>
                                <button class="btn btn-outline-secondary btn-sm"
                                    onclick="setLast24Hours()">近24小時</button>
                            </div>
                        </div>
                        <div class="d-flex align-items-end">
                            <button class="btn btn-primary btn-sm d-flex align-items-center" onclick="fetchData()">
                                <span class="material-symbols-rounded me-1">refresh</span> 更新資料
                            </button>
                        </div>
                    </div>
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-md-4">
                        <div class="card border-0 shadow-sm bg-primary text-white h-100">
                            <div class="card-body">
                                <h6 class="card-title opacity-75">當前推估人數</h6>
                                <h2 class="display-5 fw-bold mb-0" id="currentPeople">--</h2>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-body">
                                <h6 class="card-title text-muted">所選區間最高峰</h6>
                                <h3 class="fw-bold text-danger mb-0" id="peakPeople">--</h3>
                                <small class="text-muted" id="peakTime">發生於 --:--</small>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-body">
                                <h6 class="card-title text-muted">過濾常駐裝置數</h6>
                                <h3 class="fw-bold mb-0" id="blockedDevices">--</h3>
                                <small class="text-muted">已列入黑名單</small>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card shadow-sm border-0 mb-4">
                    <div class="card-header bg-white border-0 pt-4 pb-0 d-flex justify-content-between">
                        <h6 class="fw-bold mb-0">裝置數量趨勢圖</h6>
                        <small class="text-muted" id="lastUpdateTime">狀態：等待載入中...</small>
                    </div>
                    <div id="trendChartContainer" class="card-body chart-container">
                        <canvas id="trendChart" height="100"></canvas>

                        <div id="emptyState" class="empty-state-overlay d-none">
                            <span class="material-symbols-rounded text-muted mb-2" style="font-size: 3rem;"
                                id="emptyStateIcon">inbox</span>
                            <h5 class="text-muted fw-bold" id="emptyStateText">無資料</h5>
                        </div>
                    </div>
                </div>
            </div>

            <div class="tab-pane fade" id="v-pills-settings" role="tabpanel" aria-labelledby="v-pills-settings-tab"
                tabindex="0">
                <h4 class="mb-3">系統設定</h4>
                <div class="card shadow-sm border-0 mb-3">
                    <div class="card-body">
                        <img src="./assets/pasta.jpg" alt="Hamster" class="img-fluid">
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        let myChart = null;
        let globalRawData = [];

        let API_URL = "https://xshtn5716k.execute-api.ap-southeast-2.amazonaws.com/traffic";
        // document.getElementById('apiUrlInput').value = API_URL;

        // 初始化
        document.addEventListener("DOMContentLoaded", () => {
            initDatePickers();
            fetchData();
        });

        // ================= 日期選擇器相關 =================
        function formatDateTimeLocal(date) {
            const tzoffset = date.getTimezoneOffset() * 60000;
            return new Date(date - tzoffset).toISOString().slice(0, 16);
        }

        function initDatePickers() {
            setLast24Hours();
        }

        function setLast24Hours() {
            const end = new Date();
            const start = new Date(end.getTime() - (24 * 60 * 60 * 1000));
            document.getElementById('startDate').value = formatDateTimeLocal(start);
            document.getElementById('endDate').value = formatDateTimeLocal(end);
            updateChart();
        }

        function setToday() {
            const start = new Date();
            start.setHours(0, 0, 0, 0);
            const end = new Date();
            end.setHours(23, 59, 59, 999);
            document.getElementById('startDate').value = formatDateTimeLocal(start);
            document.getElementById('endDate').value = formatDateTimeLocal(end);
            updateChart();
        }
        // =======================================================

        async function fetchData() {
            document.getElementById('lastUpdateTime').innerText = '狀態：正在同步資料...';

            // 抓取下拉選單的地點名稱
            const selectedLocation = document.getElementById('locationSelect').value;
            const locationText = document.getElementById('locationSelect').options[document.getElementById('locationSelect').selectedIndex].text;

            try {
                if (API_URL.includes("xxxxxx")) {
                    console.log("載入預覽用測試資料...");
                    globalRawData = generateMockData();
                } else {
                    const requestUrl = `${API_URL}?location=${selectedLocation}`;
                    const response = await fetch(requestUrl);

                    if (!response.ok) throw new Error('網路回應錯誤');
                    globalRawData = await response.json();
                }

                document.getElementById('lastUpdateTime').innerText = `狀態：最後更新於 ${new Date().toLocaleTimeString()}`;

                // 抓完資料後，自動重新畫圖
                updateChart();

            } catch (error) {
                console.error("抓取資料失敗:", error);
                document.getElementById('lastUpdateTime').innerText = '狀態：連線失敗';
                document.getElementById('lastUpdateTime').classList.add('text-danger');
            }
        }

        function showHtmlEmptyState(message, iconName) {
            if (myChart) {
                myChart.destroy();
                myChart = null;
            }
            // 隱藏圖表
            document.getElementById('trendChart').style.display = 'none';
            // 顯示無資料區塊
            const emptyState = document.getElementById('emptyState');
            emptyState.classList.remove('d-none');

            // 更新文字與 Icon
            document.getElementById('emptyStateText').innerText = message;
            document.getElementById('emptyStateIcon').innerText = iconName;
        }

        function hideHtmlEmptyState() {
            // 顯示圖表
            document.getElementById('trendChart').style.display = 'block';
            // 隱藏無資料區塊
            document.getElementById('emptyState').classList.add('d-none');
        }

        function updateChart() {
            // 狀況一：資料庫裡完全沒資料
            if (globalRawData.length === 0) {
                showHtmlEmptyState('此地點目前無偵測資料', 'location_off'); // 使用 location_off 的 icon
                updateAnalytics([], []);
                return;
            }

            const startInput = document.getElementById('startDate').value;
            const endInput = document.getElementById('endDate').value;

            if (!startInput || !endInput) return;

            const startTimestamp = new Date(startInput).getTime() / 1000;
            const endTimestamp = new Date(endInput).getTime() / 1000;

            const filteredData = globalRawData
                .filter(item => item.timestamp >= startTimestamp && item.timestamp <= endTimestamp)
                .sort((a, b) => a.timestamp - b.timestamp);

            // 狀況二：資料庫有資料，但「所選的時間區間」內沒資料
            if (filteredData.length === 0) {
                showHtmlEmptyState('選擇的時間區間內無資料，請嘗試擴大範圍', 'history_toggle_off'); // 使用 history_toggle_off 的 icon
                updateAnalytics([], globalRawData);
                return;
            }

            // 🌟 進入正常畫圖流程，隱藏無資料區塊
            hideHtmlEmptyState();

            const timeSpanHours = (endTimestamp - startTimestamp) / 3600;
            const showDateInLabel = timeSpanHours > 24;

            const labels = filteredData.map(item => {
                let date = new Date(item.timestamp * 1000);
                if (showDateInLabel) {
                    return date.toLocaleDateString('zh-TW', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
                } else {
                    return date.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });
                }
            });

            const realCounts = filteredData.map(item => item.filtered_count || item.device_count || 0);
            const rawCounts = filteredData.map(item => item.raw_count || item.device_count || 0);

            if (myChart) myChart.destroy();
            const ctx = document.getElementById('trendChart').getContext('2d');

            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: '真實人數 (已過濾)',
                            data: realCounts,
                            borderColor: '#4582ec',
                            backgroundColor: 'rgba(13, 110, 253, 0.1)',
                            borderWidth: 3,
                            fill: true,
                            tension: 0.3,
                            pointRadius: 2
                        },
                        {
                            label: '含常駐裝置總數',
                            data: rawCounts,
                            borderColor: '#adb5bd',
                            borderDash: [5, 5],
                            borderWidth: 2,
                            fill: false,
                            tension: 0.3,
                            pointRadius: 0
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false, // 讓圖表適應外層容器高度
                    interaction: { mode: 'index', intersect: false },
                    scales: { y: { beginAtZero: true } },
                    plugins: { legend: { position: 'bottom' } }
                }
            });

            updateAnalytics(filteredData, globalRawData);
        }

        function updateAnalytics(filteredDataForChart, allRawData) {
            if (allRawData.length === 0) return;

            const latestRecord = allRawData[allRawData.length - 1];
            document.getElementById('currentPeople').innerText = latestRecord.filtered_count || latestRecord.device_count || 0;

            let maxPeople = 0;
            let peakTime = 0;
            if (filteredDataForChart.length > 0) {
                filteredDataForChart.forEach(item => {
                    const count = item.filtered_count || item.device_count || 0;
                    if (count > maxPeople) {
                        maxPeople = count;
                        peakTime = item.timestamp;
                    }
                });
                document.getElementById('peakPeople').innerText = maxPeople;
                document.getElementById('peakTime').innerText = `發生於 ${new Date(peakTime * 1000).toLocaleTimeString('zh-TW', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })}`;
            } else {
                document.getElementById('peakPeople').innerText = "--";
                document.getElementById('peakTime').innerText = "無資料";
            }

            const diff = (latestRecord.raw_count || 0) - (latestRecord.filtered_count || 0);
            document.getElementById('blockedDevices').innerText = diff > 0 ? diff : 0;
        }
    </script>
</body>

</html>
